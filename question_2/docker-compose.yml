services:
  cache:
    image: redis:7-alpine
    container_name: spam-cache
    ports:
      - "6379:6379"

  api:
    build:
      context: .
      dockerfile: Dockerfile.multistage
    container_name: spam-api
    environment:
      - REDIS_HOST=cache
      - REDIS_PORT=6379
      - CACHE_TTL_SECONDS=300
    ports:
      - "5000:5000"
    depends_on:
      - cache